name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for file in web/*.js tests/*.cjs; do node --check "$file"; done
      - run: CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -o /tmp/vigil-amd64 .
      - run: CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -o /tmp/vigil-arm64 .
